appId: com.perkyplanner.app
productName: Perky Planner
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/*'
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
win:
  executableName: perky-planner
  icon: build/icons/win/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  icon: build/icons/mac/icon.icns
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  # CI has no signing certificate; skip codesigning + notarization entirely.
  identity: null
  notarize: false
  # The macOS zip is what electron-updater actually downloads (the .dmg is for
  # humans), so its file name must match the `url` electron-builder writes into
  # latest-mac.yml. Left to itself it derives the name from productName
  # ("Perky Planner" -> "Perky.Planner-1.1.1-arm64-mac.zip") but writes the
  # dashed form ("Perky-Planner-1.1.1-arm64-mac.zip") into the manifest, so
  # every install 404s on the download. Pinning one explicit name keeps the
  # artifact and the feed entry identical.
  artifactName: ${name}-${version}-${arch}-mac.${ext}
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  category: Utility
  maintainer: Lyam-Dev
  icon: build/icons/png
  target:
    - AppImage
    - deb
    - rpm
  desktop:
    Name: Perky Planner
    Comment: Cross-platform calendar with events and daily tasks
    StartupWMClass: perky-planner
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
rpm:
  artifactName: ${name}-${version}.${ext}
# electron-builder's auto-publish requires GH_TOKEN; releases are instead
# attached by the dedicated softprops/action-gh-release step in CI.
# The `publish` block below is still required at *package* time: it makes
# electron-builder embed `app-update.yml` (the updater's feed config) into the
# installer resources and emit the `latest*.yml` channel files into dist/.
# CI passes `--publish never`, so electron-builder itself never uploads.
publish:
  provider: github
  owner: Lyam-Dev
  repo: Perky-Planner
npmRebuild: true
