appId: com.perkyplanner.app
productName: Perky Planner
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.github/*'
asarUnpack:
  - resources/**
  - '**/node_modules/better-sqlite3/**'
win:
  executableName: perky-planner
  icon: build/icons/win/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  icon: build/icons/mac/icon.icns
  target:
    - dmg
    - zip
  entitlementsInherit: build/entitlements.mac.plist
  # CI has no signing certificate, so electron-builder is told to skip
  # codesigning. Skipping leaves only the linker's partial signature with no
  # resource seal, which Squirrel/ShipIt rejects at install time with
  # "code has no resources but signature indicates they must be present".
  # `afterSign` re-signs the bundle ad-hoc so the whole app is sealed and the
  # updater can install it. Set a real "Developer ID Application: ..." identity
  # here instead to also get proper signing and notarization.
  identity: null
  notarize: false
  # The macOS zip is what electron-updater actually downloads (the .dmg is for
  # humans), so its file name must match the `url` electron-builder writes into
  # latest-mac.yml. Left to itself it derives the name from productName
  # ("Perky Planner" -> "Perky.Planner-1.1.1-arm64-mac.zip") but writes the
  # dashed form ("Perky-Planner-1.1.1-arm64-mac.zip") into the manifest, so
  # every install 404s on the download. Pinning one explicit name keeps the
  # artifact and the feed entry identical.
  artifactName: ${name}-${version}-${arch}-mac.${ext}
# electron-builder is configured with `identity: null` because CI has no
# certificate, which leaves only the linker's partial signature and no resource
# seal. Squirrel's ShipIt then refuses the update with "code has no resources
# but signature indicates they must be present". This hook re-signs the finished
# bundle ad-hoc ("-"), sealing the whole app so the update installs. It is a
# no-op once a real signing identity is configured, since that signature is
# already valid. `afterPack` (not `afterSign`) because electron-builder skips
# `afterSign` entirely when it did not sign.
afterPack: scripts/ad-hoc-sign-mac.cjs
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  category: Utility
  maintainer: Lyam-Dev
  icon: build/icons/png
  target:
    - AppImage
    - deb
    - rpm
  desktop:
    Name: Perky Planner
    Comment: Cross-platform calendar with events and daily tasks
    StartupWMClass: perky-planner
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
rpm:
  artifactName: ${name}-${version}.${ext}
# electron-builder's auto-publish requires GH_TOKEN; releases are instead
# attached by the dedicated softprops/action-gh-release step in CI.
# The `publish` block below is still required at *package* time: it makes
# electron-builder embed `app-update.yml` (the updater's feed config) into the
# installer resources and emit the `latest*.yml` channel files into dist/.
# CI passes `--publish never`, so electron-builder itself never uploads.
publish:
  provider: github
  owner: Lyam-Dev
  repo: Perky-Planner
npmRebuild: true
