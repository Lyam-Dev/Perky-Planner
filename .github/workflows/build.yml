name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Required for softprops/action-gh-release to create releases and upload assets.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux runners need these libs for Electron headless checks and
      # for compiling better-sqlite3. Ubuntu 24.04 (noble) renamed several
      # libraries with a "-t64" suffix (libasound2 -> libasound2t64, etc.)
      # and apt refuses the old names even as virtual packages, so we try
      # each base name first and fall back to the t64 variant on failure.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          install_pkg () {
            if sudo apt-get install -y --no-install-recommends "$1"; then
              return 0
            elif sudo apt-get install -y --no-install-recommends "$1-t64"; then
              echo "Installed $1-t64 (t64 transition for $1)"
            else
              echo "::warning::Neither $1 nor $1-t64 could be installed"
            fi
          }
          for pkg in libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libasound2 \
                     libnss3 libgbm1 libxss1 libxrandr2; do
            install_pkg "$pkg"
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config libu2f-udev

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundles
        run: npm run build

      - name: Package (${{ matrix.platform }})
        # --publish never: electron-builder must not attempt a GH release;
        # the dedicated step below attaches the artifacts instead.
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perky-planner-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      # Attach everything to the GitHub Release when a v* tag is pushed.
      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true