name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux runners need these libs for Electron headless checks and
      # for compiling better-sqlite3. Ubuntu 24.04 (noble) renamed several
      # libraries with a "-t64" suffix, so fall back per-package.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          renamable=""
          for pkg in libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libasound2; do
            if apt-cache show "$pkg" > /dev/null 2>&1; then
              renamable="$renamable $pkg"
            elif apt-cache show "$pkg-t64" > /dev/null 2>&1; then
              echo "Using $pkg-t64 (t64 transition for $pkg)"
              renamable="$renamable $pkg-t64"
            else
              echo "::warning::Neither $pkg nor $pkg-t64 is available"
            fi
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config \
            libnss3 libxss1 libgbm1 libxrandr2 libu2f-udev $renamable

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundles
        run: npm run build

      - name: Package (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perky-planner-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      # Attach everything to the GitHub Release when a v* tag is pushed.
      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true