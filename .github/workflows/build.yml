name: Build & Release

on:
  push:
    branches: [main]
    # Support both naming styles: v1.2.3 and 1.2.3v
    tags: ['v*', '*v']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    # Required for softprops/action-gh-release to create releases and upload assets.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux runners need these libs for Electron headless checks and
      # for compiling better-sqlite3. Ubuntu 24.04 (noble) renamed several
      # libraries with a "-t64" suffix (libasound2 -> libasound2t64, etc.)
      # and apt refuses the old names even as virtual packages, so we try
      # each base name first and fall back to the t64 variant on failure.
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          install_pkg () {
            if sudo apt-get install -y --no-install-recommends "$1"; then
              return 0
            elif sudo apt-get install -y --no-install-recommends "$1-t64"; then
              echo "Installed $1-t64 (t64 transition for $1)"
            else
              echo "::warning::Neither $1 nor $1-t64 could be installed"
            fi
          }
          for pkg in libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0 libasound2 \
                     libnss3 libgbm1 libxss1 libxrandr2; do
            install_pkg "$pkg"
          done
          sudo apt-get install -y --no-install-recommends \
            build-essential python3 pkg-config libu2f-udev

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build bundles
        run: npm run build

      - name: Package (${{ matrix.platform }})
        # --publish never: electron-builder must not attempt a GH release;
        # the dedicated step below attaches the artifacts instead.
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: perky-planner-${{ matrix.platform }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      # Re-creating a tag (delete + push again) leaves the old release behind
      # with stale assets. Remove any release matching this tag first so the
      # step below builds a fresh one with the correct files.
      - name: Remove stale release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        # bash on every OS — Windows runners default to pwsh, which cannot
        # execute this POSIX-style script.
        shell: bash
        run: |
          TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          TAG="${{ github.ref_name }}"
          IDS=$(curl -s -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$REPO/releases?per_page=100" \
            | jq -r ".[] | select(.tag_name == \"$TAG\" or (.draft and .name == \"$TAG\")) | .id")
          if [ -z "$IDS" ]; then
            echo "No existing release for tag $TAG"
          fi
          for id in $IDS; do
            echo "Deleting stale release $id for tag $TAG"
            curl -s -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://api.github.com/repos/$REPO/releases/$id"
          done

      # Attach everything to the GitHub Release for any pushed tag.
      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
          generate_release_notes: true